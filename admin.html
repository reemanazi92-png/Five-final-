<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المنظم - تحدي السرعة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="main-header glass">
    <h1>🎛️ لوحة تحكم المنظم - ⚡ تحدي السرعة ⚡</h1>
  </header>

  <main class="admin-grid">
    <!-- الأزرار والتحكم المباشر -->
    <div class="control-panel glass" style="padding: 1.5rem;">
      <h3>🎮 التحكم بالمباراة</h3>
      <button class="btn-action btn-success" id="btn-start-game">▶️ بدء اللعبة / سؤال جديد</button>
      <button class="btn-action btn-primary" id="btn-next-question">⏭️ السؤال التالي</button>
      <button class="btn-action btn-warning" id="btn-pause">⏸️ إيقاف / استكمال المؤقت</button>
      <button class="btn-action btn-danger" id="btn-reset-round">🔄 إعادة الجولة</button>
      <button class="btn-action btn-danger" id="btn-reset-all">🛑 إعادة ضبط اللعبة بالكامل</button>

      <hr style="border-color: rgba(255,255,255,0.1); margin: 1rem 0;">

      <h3>⚙️ الإعدادات العامة</h3>
      <div class="form-group">
        <label>اسم الفريق الأول (🟦):</label>
        <input type="text" id="input-team1-name" class="form-control" value="الفريق الأزرق">
      </div>
      <div class="form-group">
        <label>اسم الفريق الثاني (🟥):</label>
        <input type="text" id="input-team2-name" class="form-control" value="الفريق الأحمر">
      </div>
      <div class="form-group">
        <label>مدة السؤال (ثواني):</label>
        <select id="select-timer" class="form-control">
          <option value="15">15 ثانية</option>
          <option value="20">20 ثانية</option>
          <option value="30" selected>30 ثانية</option>
          <option value="45">45 ثانية</option>
          <option value="60">60 ثانية</option>
        </select>
      </div>
      <div class="form-group">
        <label>مدة وقت السرقة (ثواني):</label>
        <input type="number" id="input-steal-timer" class="form-control" value="10">
      </div>
      <div class="form-group">
        <label>مستوى الصعوبة المطلوب:</label>
        <select id="select-difficulty" class="form-control">
          <option value="all">🔥 جميع المستويات (عشوائي)</option>
          <option value="easy">🟢 سهل</option>
          <option value="medium">🟡 متوسط</option>
          <option value="hard">🔴 صعب</option>
        </select>
      </div>
      <button class="btn-action btn-primary" id="btn-save-settings">💾 حفظ الإعدادات</button>
    </div>

    <!-- إدارة بنك الأسئلة والتعديل اليدوي للنقاط -->
    <div class="glass" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;">
      <div>
        <h3>📊 تعديل النقاط يدويًا</h3>
        <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
          <button class="btn-action btn-primary" id="btn-add-team1">+1 الفريق الأول</button>
          <button class="btn-action btn-danger" id="btn-sub-team1">-1 الفريق الأول</button>
          <button class="btn-action btn-primary" id="btn-add-team2">+1 الفريق الثاني</button>
          <button class="btn-action btn-danger" id="btn-sub-team2">-1 الفريق الثاني</button>
        </div>
      </div>

      <div>
        <h3>➕ إضافة سؤال جديد لبنك الأسئلة</h3>
        <div class="form-group">
          <label>نص السؤال:</label>
          <input type="text" id="new-q-text" class="form-control" placeholder="مثال: اذكر 5 خضروات">
        </div>
        <div class="form-group">
          <label>التصنيف:</label>
          <input type="text" id="new-q-cat" class="form-control" placeholder="طعام">
        </div>
        <div class="form-group">
          <label>الإجابات المقبولة (مفصولة بفاصلة ,):</label>
          <textarea id="new-q-answers" class="form-control" rows="3" placeholder="خيار, طماطم, خيار, جزر, بصل"></textarea>
        </div>
        <button class="btn-action btn-success" id="btn-add-question">إضافة السؤال للبنك</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
